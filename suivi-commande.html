<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تتبع الطلبية | Suivi de Commande — ELWESMOU DZ</title>
  <link rel="icon" type="image/png" href="./logos/minimal-1-favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="rtl">

  <div class="announcement-bar">
    🚚 التوصيل متوفر لـ <span>58 ولاية</span> — الدفع عند الاستلام (تخلص كي توصلك السلعة لباب الدار) 🇩🇿
  </div>

  <header class="site-header">
    <div class="header-inner">
      <a href="./index.html" class="brand-logo">
        <img src="./logos/minimal-1-transparent.png" alt="ELWESMOU" />
      </a>
      <nav class="main-nav">
        <a href="./index.html">الرئيسية (Boutique)</a>
        <a href="./suivi-commande.html" class="active">📦 تتبع طلبيتك</a>
        <a href="./mentions-legales.html">سياسة الاستبدال والشروط</a>
      </nav>
    </div>
  </header>

  <main class="shop-container" style="max-width:680px;">
    <div class="info-card" style="text-align:center;">
      <h1 style="font-size:1.7rem;font-weight:900;margin-bottom:8px;">📦 تتبع حالة طلبيتك (Suivi de Commande)</h1>
      <p style="color:var(--text-secondary);margin-bottom:20px;">
        أدخل رقم الهاتف لي درت بيه الطلبية باش تشوف وين لحقت السلعة تاعك:
      </p>

      <form onsubmit="searchOrder(event)" style="display:flex;gap:10px;max-width:460px;margin:0 auto 24px;">
        <input type="tel" id="trackPhoneInput" required placeholder="05 / 06 / 07 XX XX XX XX" style="flex:1;padding:12px 16px;border:1.5px solid #DCDCD8;border-radius:999px;font-family:inherit;font-size:0.95rem;" />
        <button type="submit" class="btn-primary" id="trackBtn">بحث 🔍</button>
      </form>

      <div id="trackResultBox" style="text-align:right;"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a href="./index.html" class="footer-logo">
        <img src="./logos/minimal-1-dark-transparent.png" alt="ELWESMOU" />
      </a>
      <div class="footer-links">
        <a href="./index.html">الرئيسية</a>
        <a href="./mentions-legales.html">سياسة الاستبدال والشروط القانونية</a>
      </div>
    </div>
  </footer>

  <script src="./app.js"></script>
  <script>
    async function searchOrder(e) {
      if (e) e.preventDefault();
      const phone = document.getElementById('trackPhoneInput').value.replace(/\s+/g, '');
      const box = document.getElementById('trackResultBox');
      const btn = document.getElementById('trackBtn');

      btn.disabled = true;
      btn.textContent = '⏳...';

      let matches = [];

      // 1. Si Google Sheets est connecté, on cherche en direct dans le Google Sheet (Colonne K = Statut)
      if (typeof GOOGLE_SHEET_WEBHOOK_URL !== 'undefined' && GOOGLE_SHEET_WEBHOOK_URL) {
        try {
          const res = await fetch(GOOGLE_SHEET_WEBHOOK_URL + '?phone=' + encodeURIComponent(phone));
          const json = await res.json();
          if (json && Array.isArray(json.orders)) {
            matches = json.orders;
          }
        } catch (err) {
          console.warn('Fallback sur stockage local:', err);
        }
      }

      // 2. Sinon (ou en complément), on vérifie les commandes enregistrées sur l'appareil
      if (matches.length === 0) {
        const localOrders = JSON.parse(localStorage.getItem('elwesmou_orders') || '[]');
        matches = localOrders.filter(o => (o.phone || '').replace(/\s+/g, '').includes(phone));
      }

      btn.disabled = false;
      btn.textContent = 'بحث 🔍';

      if (matches.length === 0) {
        box.innerHTML = `
          <div style="background:#FFF5F0;border:1px solid var(--brand-orange);padding:16px;border-radius:12px;text-align:center;">
            <strong>لم نجد طلبية مسجلة بهذا الرقم حالياً.</strong>
            <p style="font-size:0.88rem;color:var(--text-secondary);margin-top:4px;">إذا درت الطلبية تاعك مؤخراً، فريقنا راح يعيطلك في التليفون لتأكيدها وإرسالها!</p>
          </div>
        `;
        return;
      }

      box.innerHTML = matches.map(o => `
        <div style="background:var(--bg-subtle);padding:16px;border-radius:12px;margin-bottom:12px;border-right:4px solid var(--brand-orange);">
          <div style="display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px;">
            <span>رقم الطلبية : ${o.orderId}</span>
            <span style="color:var(--brand-orange);">${o.totalDA}</span>
          </div>
          <div style="font-size:0.9rem;"><strong>المنتج :</strong> ${o.productName} (x${o.quantity})</div>
          <div style="font-size:0.9rem;"><strong>الولاية :</strong> ${o.wilaya} — ${o.commune} (${o.deliveryType})</div>
          <div style="font-size:0.95rem;margin-top:8px;padding:8px 12px;background:#DCFCE7;color:#15803D;border-radius:8px;font-weight:800;">
            الحالة (Statut) : ${o.status}
          </div>
        </div>
      `).join('');
    }

    const params = new URLSearchParams(window.location.search);
    if (params.get('phone')) {
      document.getElementById('trackPhoneInput').value = params.get('phone');
      searchOrder();
    }
  </script>
</body>
</html>
